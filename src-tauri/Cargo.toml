[package]
name = "windle"
version = "0.4.0"
description = "Windle — macOS system maintenance toolkit"
authors = ["Windle"]
edition = "2021"
rust-version = "1.77.2"

# The `_lib` suffix avoids a name collision with the binary on Windows; it is
# harmless on macOS and keeps `cargo test` working against the library.
[lib]
name = "windle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
walkdir = "2"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process"] }
thiserror = "2"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
